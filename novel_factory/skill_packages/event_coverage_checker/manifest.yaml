id: event-coverage-checker
name: Event Coverage Checker
version: "2.0.0"
kind: validator
class_name: EventCoverageCheckerSkill
description: "检查 Author 正文是否覆盖写作指令中的必需事件。"
enabled: true
builtin: true
package:
  name: event_coverage_checker
  handler: handler.py
  entry_class: EventCoverageCheckerSkill
  prompts_dir: prompts
  rules_dir: rules
  fixtures: tests/fixtures.yaml
allowed_agents:
  - author
  - manual
allowed_stages:
  - after_llm
  - before_save
  - manual
allowed_targets:
  - agent: author
    stage: after_llm
permissions:
  read_context: false
  read_chapter: false
  transform_text: false
  validate_text: true
  write_quality_report: false
  write_skill_run: true
  write_chapter_content: false
  update_chapter_status: false
  send_agent_message: false
  call_llm: false
  call_network: false
input_schema:
  type: object
  required:
    - content
  properties:
    content:
      type: string
    required_events:
      type: array
      items:
        type: string
    implemented_events:
      type: array
      items:
        type: string
output_schema:
  type: object
  required:
    - issues
    - warnings
    - blocking
  properties:
    coverage:
      type: number
    missing_events:
      type: array
      items:
        type: string
    issues:
      type: array
      items:
        type: object
    warnings:
      type: array
      items:
        type: string
    blocking:
      type: boolean
failure_policy:
  on_error: warn
  max_retries: 0
  timeout_seconds: null
  blocking_threshold: null
