cases:
  - name: full_coverage
    input:
      content: "主角林动走进拍卖场，最终以高价夺得三品灵药。"
      required_events:
        - "林动参加拍卖会"
        - "夺得灵药"
      implemented_events:
        - "林动参加拍卖会"
        - "夺得灵药"
    expect:
      ok: true
      check:
        coverage: 1.0
        blocking: false
  - name: missing_event
    input:
      content: "主角林动走进拍卖场。"
      required_events:
        - "林动参加拍卖会"
        - "夺得灵药"
      implemented_events:
        - "林动参加拍卖会"
    expect:
      ok: false
      check:
        coverage: 0.5
        blocking: true
  - name: empty_content
    input:
      content: ""
      required_events:
        - "事件发生"
      implemented_events: []
    expect:
      ok: false
      check:
        blocking: true
