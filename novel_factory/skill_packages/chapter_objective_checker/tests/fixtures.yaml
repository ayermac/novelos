cases:
  - name: valid_objective
    input:
      objective: "主角林动在拍卖会上夺得灵药，与王家发生冲突"
      required_events:
        - "林动参加拍卖会"
        - "夺得三品灵药"
        - "王家子弟挑衅"
      constraints:
        - "保持第三人称视角"
    expect:
      ok: true
      check:
        score_min: 90
  - name: vague_objective
    input:
      objective: "主角继续变强"
      required_events: []
      constraints: []
    expect:
      ok: false
      check:
        blocking: true
  - name: short_objective
    input:
      objective: "打斗"
      required_events:
        - "打架"
    expect:
      ok: false
      check:
        blocking: true
