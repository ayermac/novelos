id: memory-patch-validator
name: Memory Patch Validator
version: "2.0.0"
kind: validator
class_name: MemoryPatchValidatorSkill
description: "检查 Memory Curator 抽取的记忆 patch 是否结构完整。"
enabled: true
builtin: true
package:
  name: memory_patch_validator
  handler: handler.py
  entry_class: MemoryPatchValidatorSkill
  prompts_dir: prompts
  rules_dir: rules
  fixtures: tests/fixtures.yaml
allowed_agents:
  - memory_curator
  - manual
allowed_stages:
  - after_extract
  - before_save
  - manual
allowed_targets:
  - agent: memory_curator
    stage: after_extract
permissions:
  read_context: false
  read_chapter: false
  transform_text: false
  validate_text: true
  write_quality_report: false
  write_skill_run: true
  write_chapter_content: false
  update_chapter_status: false
  send_agent_message: false
  call_llm: false
  call_network: false
input_schema:
  type: object
  required:
    - patches
  properties:
    patches:
      type: array
      items:
        type: object
output_schema:
  type: object
  required:
    - issues
    - warnings
    - blocking
  properties:
    patch_count:
      type: number
    issues:
      type: array
      items:
        type: object
    warnings:
      type: array
      items:
        type: string
    blocking:
      type: boolean
failure_policy:
  on_error: warn
  max_retries: 0
  timeout_seconds: null
  blocking_threshold: null
