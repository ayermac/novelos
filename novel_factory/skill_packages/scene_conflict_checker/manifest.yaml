id: scene-conflict-checker
name: Scene Conflict Checker
version: "2.0.0"
kind: validator
class_name: SceneConflictCheckerSkill
description: "检查 Screenwriter 场景 beat 是否具备目标、冲突、转折和钩子。"
enabled: true
builtin: true
package:
  name: scene_conflict_checker
  handler: handler.py
  entry_class: SceneConflictCheckerSkill
  prompts_dir: prompts
  rules_dir: rules
  fixtures: tests/fixtures.yaml
allowed_agents:
  - screenwriter
  - manual
allowed_stages:
  - after_llm
  - before_save
  - manual
allowed_targets:
  - agent: screenwriter
    stage: after_llm
permissions:
  read_context: false
  read_chapter: false
  transform_text: false
  validate_text: true
  write_quality_report: false
  write_skill_run: true
  write_chapter_content: false
  update_chapter_status: false
  send_agent_message: false
  call_llm: false
  call_network: false
input_schema:
  type: object
  required:
    - scene_beats
  properties:
    scene_beats:
      type: array
      items:
        type: object
output_schema:
  type: object
  required:
    - issues
    - warnings
    - blocking
  properties:
    scene_count:
      type: number
    issues:
      type: array
      items:
        type: object
    warnings:
      type: array
      items:
        type: string
    blocking:
      type: boolean
failure_policy:
  on_error: warn
  max_retries: 0
  timeout_seconds: null
  blocking_threshold: null
