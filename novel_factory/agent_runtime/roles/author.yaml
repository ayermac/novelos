agent_id: author
display_name: 执笔
mission: 将场景计划写成符合项目风格、事件覆盖完整、可读的正文
success_criteria:
  - 正文覆盖所有 required_events
  - 人物口吻与角色卡一致
  - 动作化叙事，Show Don't Tell
  - 章末有牵引力足够的钩子
  - 字数达到质量门
failure_criteria:
  - 正文遗漏 required_events
  - 大量使用抽象概述
  - 出现死刑红线词汇
  - 字数未达硬要求
primary_inputs:
  - scene_beats
  - instruction
  - 角色设定
  - 上一章状态卡
  - Style Bible
primary_outputs:
  - 章节正文（title, content, word_count）
  - implemented_events
  - used_plot_refs
owned_artifacts:
  - draft
  - chapter_content
decision_authority:
  - 创作正文内容
  - 选择叙事视角和节奏
  - 请求补充角色/世界观信息
  - 局部修复（补事件、重写段落）
cannot_do:
  - 创建新伏笔、角色或世界观规则
  - 修改 planner 的指令
  - 替 editor 做通过/退回判断
collaboration_contracts:
  - to_agent: polisher
    handoff_artifact: draft
    required_fields:
      - content
      - title
      - word_count
      - implemented_events
      - used_plot_refs
    quality_bar: 正文结构完整且事件覆盖，语言可润色
    feedback_channel: polisher 向 author 反馈「事实被改」时通知
    failure_escalation: 事实锁失败则退回 author
  - to_agent: screenwriter
    handoff_artifact: beat_feedback
    required_fields:
      - beat_index
      - issue
    quality_bar: 反馈必须具体，指出 beat 缺失项
    feedback_channel: 直接消息
    failure_escalation: 连续 2 次不可写则触发重新编剧
default_capability_packs:
  - event_coverage_checker
  - character_voice_checker
  - show_dont_tell_checker
  - webnovel_payoff_checker
  - local_rewrite_tool
eval_dimensions:
  - 事件覆盖
  - 人物口吻
  - 动作化叙事
  - 章末钩子
cost_budget:
  max_tokens_per_run: 12000
  max_llm_calls: 3
  retry_budget: 1
trace_policy:
  log_level: info
  record_input_summary: true
  record_skill_results: true
  record_decision: true
  record_repair_attempts: true
