skill_id: show-dont-tell
name: 展示而非讲述指南
description: |
  "展示而非讲述"的核心技巧：用动作代替心理描写、用细节代替概括、
  用对话代替叙述。帮助 LLM 写出更有画面感和沉浸感的文字。
