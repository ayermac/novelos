id: word-count-gate
name: Word Count Gate
version: 1.0.0
kind: validator
class_name: WordCountGateSkill
description: 字数上下界检查
enabled: true
builtin: true
allowed_agents:
- editor
- author
- polisher
- manual
allowed_stages:
- after_llm
- before_save
- before_review
- manual
permissions:
  read_context: false
  read_chapter: false
  transform_text: false
  validate_text: true
  write_quality_report: false
  write_skill_run: true
  write_chapter_content: false
  update_chapter_status: false
  send_agent_message: false
  call_llm: false
  call_network: false
input_schema:
  type: object
  required:
  - text
  properties:
    text:
      type: string
    content:
      type: string
    word_target:
      type: integer
    tolerance_ratio:
      type: number
output_schema:
  type: object
  required:
  - passed
  - word_count
  properties:
    passed:
      type: boolean
    word_count:
      type: integer
    target:
      type: integer
    lower_bound:
      type: integer
    upper_bound:
      type: integer
    issues:
      type: array
      items:
        type: string
failure_policy:
  on_error: warn
  max_retries: 0
  timeout_seconds: null
  blocking_threshold: null
layer: code
category: structure
severity_default: blocking
knowledge_skill_ids: []
dedupe_group: length_contract
runtime_scope:
  agents:
  - author
  - editor
  chapters: all
