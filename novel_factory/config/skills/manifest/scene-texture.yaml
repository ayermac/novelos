id: scene-texture
name: Scene Texture Checker
version: 1.0.0
kind: validator
class_name: SceneTextureChecker
description: 检测动作/环境/感官线索不足
enabled: true
builtin: true
allowed_agents:
- editor
- qualityhub
- manual
allowed_stages:
- diagnose
- advisory
- before_review
- final_gate
- manual
permissions:
  read_context: false
  read_chapter: false
  transform_text: false
  validate_text: true
  write_quality_report: false
  write_skill_run: true
  write_chapter_content: false
  update_chapter_status: false
  send_agent_message: false
  call_llm: false
  call_network: false
input_schema:
  type: object
  required:
  - text
  properties:
    text:
      type: string
      description: 要检测的文本内容
    content:
      type: string
      description: 备用文本字段（兼容）
output_schema:
  type: object
  required:
  - score
  - findings
  properties:
    score:
      type: number
      minimum: 0
      maximum: 100
      description: 场景质感评分
    sensory_per_1000:
      type: number
      minimum: 0
    action_per_1000:
      type: number
      minimum: 0
    bare_paragraphs:
      type: integer
      minimum: 0
    findings:
      type: array
      items:
        type: object
config_schema:
  type: object
  properties: {}
default_config: {}
failure_policy:
  on_error: warn
  max_retries: 0
  timeout_seconds: null
  blocking_threshold: null
layer: code
category: prose
severity_default: advisory
knowledge_skill_ids:
- scene-sensory
dedupe_group: prose_quality
runtime_scope:
  agents:
  - editor
  chapters: all
