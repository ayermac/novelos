id: commercial-viability-check
name: Commercial Viability Checker
version: "1.0.0"
kind: validator
class_name: CommercialViabilityChecker
description: "检测商业可行性：首章钩子强度、付费点密度、追读吸引力、主角能动性"
enabled: true
builtin: true
allowed_agents:
  - editor
allowed_stages:
  - before_review
permissions:
  read_context: false
  read_chapter: false
  transform_text: false
  validate_text: true
  write_quality_report: false
  write_skill_run: true
  write_chapter_content: false
  update_chapter_status: false
  send_agent_message: false
  call_llm: false
  call_network: false
input_schema:
  type: object
  required:
    - content
  properties:
    content:
      type: string
    chapter_number:
      type: integer
    genre_contract:
      type: object
output_schema:
  type: object
  required:
    - passed
    - score
    - findings
    - summary
  properties:
    passed:
      type: boolean
    score:
      type: number
    findings:
      type: array
      items:
        type: object
        properties:
          severity:
            type: string
          code:
            type: string
          message:
            type: string
          suggestion:
            type: string
    summary:
      type: string
failure_policy:
  on_error: warn
  max_retries: 0
  timeout_seconds: null
  blocking_threshold: null
