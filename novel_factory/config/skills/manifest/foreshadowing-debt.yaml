id: foreshadowing-debt
name: Foreshadowing Debt Checker
version: "1.0.0"
kind: validator
class_name: ForeshadowingDebtSkill
description: "检查伏笔债务：已埋未兑现、已过期、指令未覆盖"
enabled: true
builtin: true
allowed_agents:
  - planner
  - editor
  - manual
allowed_stages:
  - after_llm
  - before_review
  - manual
permissions:
  read_context: false
  read_chapter: false
  transform_text: false
  validate_text: true
  write_quality_report: false
  write_skill_run: true
  write_chapter_content: false
  update_chapter_status: false
  send_agent_message: false
  call_llm: false
  call_network: false
input_schema:
  type: object
  properties:
    plot_holes:
      type: array
      items:
        type: object
    instruction:
      type: object
    used_plot_refs:
      type: array
      items:
        type: string
    chapter_number:
      type: integer
    content:
      type: string
output_schema:
  type: object
  required:
    - debt
    - issues
    - blocking
  properties:
    debt:
      type: array
      items:
        type: string
    stale:
      type: array
      items:
        type: string
    missing_plants:
      type: array
      items:
        type: string
    missing_resolves:
      type: array
      items:
        type: string
    issues:
      type: array
      items:
        type: string
    blocking:
      type: boolean
failure_policy:
  on_error: warn
  max_retries: 0
  timeout_seconds: null
  blocking_threshold: null
