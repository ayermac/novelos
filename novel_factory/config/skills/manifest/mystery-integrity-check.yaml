id: mystery-integrity-check
name: Mystery Integrity Checker
version: "1.0.0"
kind: validator
class_name: MysteryIntegrityChecker
description: "检测悬疑完整性：伏笔债务、揭示节奏、误导合理性、术语过载"
enabled: false  # 默认关闭，仅悬疑/推理/惊悚类型启用
builtin: true
allowed_agents:
  - editor
allowed_stages:
  - before_review
permissions:
  read_context: false
  read_chapter: false
  transform_text: false
  validate_text: true
  write_quality_report: false
  write_skill_run: true
  write_chapter_content: false
  update_chapter_status: false
  send_agent_message: false
  call_llm: false
  call_network: false
input_schema:
  type: object
  required:
    - content
  properties:
    content:
      type: string
    genre_contract:
      type: object
    foreshadowing:
      type: array
      items:
        type: object
output_schema:
  type: object
  required:
    - passed
    - score
    - findings
    - summary
  properties:
    passed:
      type: boolean
    score:
      type: number
    findings:
      type: array
      items:
        type: object
        properties:
          severity:
            type: string
          code:
            type: string
          message:
            type: string
          suggestion:
            type: string
    summary:
      type: string
failure_policy:
  on_error: warn
  max_retries: 0
  timeout_seconds: null
  blocking_threshold: null
