id: event-coverage-checker
name: Event Coverage Checker
version: 1.0.0
kind: validator
type: validator
class_name: EventCoverageCheckerSkill
description: 检查 Author 正文和 implemented_events 是否覆盖 required_events。
enabled: true
builtin: true
allowed_agents:
- author
- manual
allowed_stages:
- after_llm
- manual
allowed_targets:
- agent: author
  stage: after_llm
permissions:
  read_context: false
  read_chapter: false
  transform_text: false
  validate_text: true
  write_quality_report: false
  write_skill_run: true
  write_chapter_content: false
  update_chapter_status: false
  send_agent_message: false
  call_llm: false
  call_network: false
input_schema:
  type: object
  required:
  - content
  properties:
    content:
      type: string
    required_events:
      type: array
      items:
        type: string
    implemented_events:
      type: array
      items:
        type: string
output_schema:
  type: object
  required:
  - coverage
  - missing_events
  - issues
  - warnings
  - blocking
  properties:
    coverage:
      type: number
    missing_events:
      type: array
      items:
        type: string
    issues:
      type: array
      items:
        type: object
    warnings:
      type: array
      items:
        type: string
    blocking:
      type: boolean
failure_policy:
  on_error: warn
  max_retries: 0
  timeout_seconds: null
  blocking_threshold: null
layer: code
category: facts
severity_default: blocking
knowledge_skill_ids: []
dedupe_group: facts_contract
runtime_scope:
  agents:
  - author
  chapters: all
