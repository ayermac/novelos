id: chapter-seam
name: Chapter Seam Checker
version: "1.0.0"
kind: validator
class_name: ChapterSeamSkill
description: "确定性章节衔接检查：时间/地点/钩子断裂检测"
enabled: true
builtin: true
allowed_agents:
  - editor
  - manual
allowed_stages:
  - before_review
  - manual
permissions:
  read_context: false
  read_chapter: false
  transform_text: false
  validate_text: true
  write_quality_report: false
  write_skill_run: true
  write_chapter_content: false
  update_chapter_status: false
  send_agent_message: false
  call_llm: false
  call_network: false
input_schema:
  type: object
  required:
    - content
  properties:
    content:
      type: string
    project_id:
      type: string
    chapter_number:
      type: integer
output_schema:
  type: object
  required:
    - passed
    - issues
  properties:
    passed:
      type: boolean
    issues:
      type: array
      items:
        type: string
    suggestions:
      type: array
      items:
        type: string
    blocking_count:
      type: integer
failure_policy:
  on_error: warn
  max_retries: 0
  timeout_seconds: null
  blocking_threshold: null
