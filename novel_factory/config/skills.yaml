# v2.3 Skill Configuration with Package Support
# 所有 Skill 必须在此配置，v2.3 引入 package 优先加载

skills:
  humanizer-zh:
    enabled: true
    # v2.3: package 优先，如果存在 package 则从 package 加载
    package: skill_packages/humanizer_zh
    # v2.2 兼容: manifest 作为 fallback
    manifest: config/skills/manifest/humanizer-zh.yaml
    # v2.1 兼容字段（如果存在 package/manifest，以 package/manifest 为准）
    type: transform
    class: HumanizerZhSkill
    description: "中文AI去味，用于Polisher"
    config:
      preserve_facts: true
      max_change_ratio: 0.35
      fail_on_fact_risk: true

  ai-style-detector:
    enabled: true
    # v2.3: package 优先
    package: skill_packages/ai_style_detector
    # v2.2 兼容: manifest 作为 fallback
    manifest: config/skills/manifest/ai-style-detector.yaml
    # v2.1 兼容字段
    type: validator
    class: AIStyleDetectorSkill
    description: "AI味检测，用于Polisher和Editor"
    config:
      warn_threshold: 45
      fail_threshold: 70

  narrative-quality:
    enabled: true
    # v2.3: package 优先
    package: skill_packages/narrative_quality
    # v2.2 兼容: manifest 作为 fallback
    manifest: config/skills/manifest/narrative-quality.yaml
    # v2.1 兼容字段
    type: validator
    class: NarrativeQualityScorer
    description: "叙事质量评分，用于Editor和QualityHub"
    config:
      pass_score: 75

  style-bible-checker:
    enabled: true
    # v2.2 兼容: Style Bible Checker 仍是 legacy class，但必须显式绑定 manifest
    manifest: config/skills/manifest/style-bible-checker.yaml
    # v2.1 兼容字段
    type: validator
    class: StyleBibleCheckerSkill
    description: "Style Bible风格合规检查，用于Editor和Polisher"
    config:
      blocking_threshold: 50

  chapter-objective-checker:
    enabled: true
    package: skill_packages/chapter_objective_checker
    manifest: config/skills/manifest/chapter-objective-checker.yaml
    type: validator
    class: ChapterObjectiveCheckerSkill
    description: "检查 Planner 章节目标是否具体、可执行"
    config: {}

  scene-conflict-checker:
    enabled: true
    package: skill_packages/scene_conflict_checker
    manifest: config/skills/manifest/scene-conflict-checker.yaml
    type: validator
    class: SceneConflictCheckerSkill
    description: "检查 Screenwriter 场景 beat 是否具备目标、冲突、转折和钩子"
    config: {}

  event-coverage-checker:
    enabled: true
    package: skill_packages/event_coverage_checker
    manifest: config/skills/manifest/event-coverage-checker.yaml
    type: validator
    class: EventCoverageCheckerSkill
    description: "检查 Author 正文是否覆盖写作指令中的必需事件"
    config: {}

  memory-patch-validator:
    enabled: true
    package: skill_packages/memory_patch_validator
    manifest: config/skills/manifest/memory-patch-validator.yaml
    type: validator
    class: MemoryPatchValidatorSkill
    description: "检查 Memory Curator 抽取的记忆 patch 是否结构完整"
    config: {}

  show-dont-tell:
    enabled: true
    type: validator
    class: ShowDontTellValidator
    description: "检测叙述者直白情绪/心理解释（排除对白）"
    config: {}

  info-dump-detector:
    enabled: true
    type: validator
    class: InfoDumpDetector
    description: "检测设定灌输、连续解释、说明腔段落"
    config: {}

  scene-texture:
    enabled: true
    type: validator
    class: SceneTextureChecker
    description: "检测动作/环境/感官线索不足"
    config: {}

  dialogue-naturalness:
    enabled: true
    type: validator
    class: DialogueNaturalnessChecker
    description: "检测功能化对白、对白占比异常、缺少摩擦/潜台词"
    config: {}

# Agent挂载配置
agent_skills:
  planner:
    after_llm:
      - chapter-objective-checker

  screenwriter:
    after_llm:
      - scene-conflict-checker

  author:
    after_llm:
      - event-coverage-checker

  polisher:
    after_llm:
      - humanizer-zh
    before_save:
      - ai-style-detector

  editor:
    before_review:
      - ai-style-detector
      - narrative-quality
      - style-bible-checker

  memory_curator:
    after_extract:
      - memory-patch-validator
