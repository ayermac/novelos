# Skill Configuration
# 所有 Skill 必须在此配置，统一使用 class 加载

skills:
  humanizer-zh:
    enabled: true
    manifest: config/skills/manifest/humanizer-zh.yaml
    type: transform
    class: HumanizerZhSkill
    description: "中文AI去味，用于Polisher"
    config:
      preserve_facts: true
      max_change_ratio: 0.35
      fail_on_fact_risk: true

  ai-style-detector:
    enabled: true
    manifest: config/skills/manifest/ai-style-detector.yaml
    type: validator
    class: AIStyleDetectorSkill
    description: "AI味检测，用于Polisher和Editor"
    config:
      warn_threshold: 45
      fail_threshold: 70

  narrative-quality:
    enabled: true
    manifest: config/skills/manifest/narrative-quality.yaml
    type: validator
    class: NarrativeQualityScorer
    description: "叙事质量评分，用于Editor和QualityHub"
    config:
      pass_score: 75

  style-bible-checker:
    enabled: true
    manifest: config/skills/manifest/style-bible-checker.yaml
    type: validator
    class: StyleBibleCheckerSkill
    description: "Style Bible风格合规检查，用于Editor和Polisher"
    config:
      blocking_threshold: 50

  chapter-objective-checker:
    enabled: true
    manifest: config/skills/manifest/chapter-objective-checker.yaml
    type: validator
    class: ChapterObjectiveCheckerSkill
    description: "检查 Planner 章节目标是否具体、可执行"
    config: {}

  scene-conflict-checker:
    enabled: true
    manifest: config/skills/manifest/scene-conflict-checker.yaml
    type: validator
    class: SceneConflictCheckerSkill
    description: "检查 Screenwriter 场景 beat 是否具备目标、冲突、转折和钩子"
    config: {}

  event-coverage-checker:
    enabled: true
    manifest: config/skills/manifest/event-coverage-checker.yaml
    type: validator
    class: EventCoverageCheckerSkill
    description: "检查 Author 正文是否覆盖写作指令中的必需事件"
    config: {}

  memory-patch-validator:
    enabled: true
    manifest: config/skills/manifest/memory-patch-validator.yaml
    type: validator
    class: MemoryPatchValidatorSkill
    description: "检查 Memory Curator 抽取的记忆 patch 是否结构完整"
    config: {}

  show-dont-tell:
    enabled: true
    manifest: config/skills/manifest/show-dont-tell.yaml
    type: validator
    class: ShowDontTellValidator
    description: "检测叙述者直白情绪/心理解释（排除对白）"
    config: {}

  info-dump-detector:
    enabled: true
    manifest: config/skills/manifest/info-dump-detector.yaml
    type: validator
    class: InfoDumpDetector
    description: "检测设定灌输、连续解释、说明腔段落"
    config: {}

  scene-texture:
    enabled: true
    manifest: config/skills/manifest/scene-texture.yaml
    type: validator
    class: SceneTextureChecker
    description: "检测动作/环境/感官线索不足"
    config: {}

  dialogue-naturalness:
    enabled: true
    manifest: config/skills/manifest/dialogue-naturalness.yaml
    type: validator
    class: DialogueNaturalnessChecker
    description: "检测功能化对白、对白占比异常、缺少摩擦/潜台词"
    config: {}

  # v6.8.0: Skillized Quality Gates
  continuity-gate:
    enabled: true
    manifest: config/skills/manifest/continuity-gate.yaml
    type: validator
    class: ContinuityGateSkill
    description: "确定性叙事连续性门控：时间回退、跨章锚点、标题质量、事件重播检测"
    config: {}

  chapter-seam:
    enabled: true
    manifest: config/skills/manifest/chapter-seam.yaml
    type: validator
    class: ChapterSeamSkill
    description: "确定性章节衔接检查：时间/地点/钩子断裂检测"
    config: {}

  death-penalty:
    enabled: true
    manifest: config/skills/manifest/death-penalty.yaml
    type: validator
    class: DeathPenaltySkill
    description: "检测AI死刑红线短语（AI cliches）"
    config: {}

  word-count-gate:
    enabled: true
    manifest: config/skills/manifest/word-count-gate.yaml
    type: validator
    class: WordCountGateSkill
    description: "字数上下界检查"
    config: {}

  fact-lock:
    enabled: true
    manifest: config/skills/manifest/fact-lock.yaml
    type: validator
    class: FactLockSkill
    description: "检查润色后关键事实是否被保留"
    config: {}

  foreshadowing-debt:
    enabled: true
    manifest: config/skills/manifest/foreshadowing-debt.yaml
    type: validator
    class: ForeshadowingDebtSkill
    description: "检查伏笔债务：已埋未兑现、已过期、指令未覆盖"
    config: {}

  opening-hook-checker:
    enabled: true
    manifest: config/skills/manifest/opening-hook-checker.yaml
    type: validator
    class: OpeningHookChecker
    description: "检查前 200 字是否有开局钩子"
    config: {}

  excitement-density-checker:
    enabled: true
    manifest: config/skills/manifest/excitement-density-checker.yaml
    type: validator
    class: ExcitementDensityChecker
    description: "检查全文爽点分布和压抑占比"
    config: {}

  # v6.9.1: 新增编辑专项 Skills
  commercial-viability-check:
    enabled: true
    manifest: config/skills/manifest/commercial-viability-check.yaml
    type: validator
    class: CommercialViabilityChecker
    description: "检测商业可行性：首章钩子强度、付费点密度、追读吸引力、主角能动性"
    config: {}

  pacing-profile-check:
    enabled: true
    manifest: config/skills/manifest/pacing-profile-check.yaml
    type: validator
    class: PacingProfileChecker
    description: "检测节奏配置：段落长短分布、高潮位置、场景多样性、对话/描写比例"
    config: {}

  character-voice-check:
    enabled: true
    manifest: config/skills/manifest/character-voice-check.yaml
    type: validator
    class: CharacterVoiceChecker
    description: "检测角色口吻一致性、工具人风险、角色出场均衡性"
    config: {}

  mystery-integrity-check:
    enabled: false  # 默认关闭，仅悬疑/推理/惊悚类型启用
    manifest: config/skills/manifest/mystery-integrity-check.yaml
    type: validator
    class: MysteryIntegrityChecker
    description: "检测悬疑完整性：伏笔债务、揭示节奏、误导合理性、术语过载"
    config: {}
    failure_policy: warn
    project_override_key: genre

# Agent挂载配置
agent_skills:
  planner:
    after_llm:
      - chapter-objective-checker
      - foreshadowing-debt

  screenwriter:
    after_llm:
      - scene-conflict-checker

  author:
    after_llm:
      - event-coverage-checker
      - death-penalty
      - word-count-gate
      - opening-hook-checker
      - excitement-density-checker  # v6.8.5: 爽点密度预防性检查

  polisher:
    after_llm:
      - humanizer-zh
    before_save:
      - ai-style-detector
      - fact-lock
      - death-penalty

  editor:
    before_review:
      - ai-style-detector
      - narrative-quality
      - style-bible-checker
      - show-dont-tell
      - info-dump-detector
      - scene-texture
      - dialogue-naturalness
      - continuity-gate
      - chapter-seam
      - death-penalty
      - word-count-gate
      - foreshadowing-debt
      - opening-hook-checker
      - excitement-density-checker
      - commercial-viability-check
      - pacing-profile-check
      - character-voice-check
      - mystery-integrity-check
    advisory:
      - show-dont-tell
      - info-dump-detector
      - scene-texture
      - dialogue-naturalness

  memory_curator:
    after_extract:
      - memory-patch-validator
