[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-factory"
version = "1.3.0"
description = "AI-powered novel chapter production factory"
requires-python = ">=3.9"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "tenacity>=8.2.0",
]

[project.scripts]
novelos = "novel_factory.cli:main"

[tool.setuptools.packages.find]
include = ["novel_factory*"]

[tool.setuptools.package-data]
novel_factory = ["db/schema/*.sql", "db/migrations/*.sql", "config/*.yaml", "*.yaml", "skill_packages/**/*", "agent_runtime/roles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = [
    "unit: Pure unit tests, no DB or external dependencies",
    "integration: Tests requiring DB or cross-module interaction",
    "slow: Tests taking >10s (full suite, real LLM, long workflows)",
    "llm: Tests that call or mock LLM providers",
    "frontend: Tests that build or check frontend assets",
    "workflow: Tests covering LangGraph workflow execution",
    "skill: Tests for the Skill system (registry, hooks, individual skills)",
]
