appId: works.earendil.novelos
productName: Novelos
copyright: Copyright © 2025 Earendil Works
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../frontend/dist
    to: frontend/dist
    filter:
      - "**/*"
  - from: resources/sidecar
    to: sidecar
    filter:
      - "**/*"
mac:
  category: public.app-category.productivity
  target:
    - target: dir
      arch:
        - arm64
        - x64
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
asar: true
# Do not sign or notarize for M2
publish: null
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Office
